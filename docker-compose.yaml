services:
    # relational database
    postgres:
        image: postgres:16-alpine
        container_name: aegis-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: aegis
            POSTGRES_PASSWORD: aegis
            POSTGRES_DB: aegis
        ports:
            - "5432:5432"
        networks:
            - aegis-net
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
            interval: 8s
            timeout: 4s
            retries: 4
            start_period: 16s

    # in-memory database
    redis:
        image: redis:8.0-alpine
        container_name: aegis-redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        networks:
            - aegis-net
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 8s
            timeout: 4s
            retries: 4
            start_period: 4s

networks:
    aegis-net:

volumes:
    postgres_data:
    redis_data:
