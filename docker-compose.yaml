services:
    # relational database
    postgres:
        image: postgres:16-alpine
        container_name: aegis-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: aegis
            POSTGRES_PASSWORD: aegis
            POSTGRES_DB: aegis
        ports:
            - "5432:5432"
        networks:
            - aegis-net
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
            interval: 8s
            timeout: 4s
            retries: 4
            start_period: 16s

networks:
    aegis-net:

volumes:
    postgres_data:
