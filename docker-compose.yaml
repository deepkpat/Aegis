services:
    # relational database
    postgres:
        image: postgres:16-alpine
        container_name: aegis-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: aegis
            POSTGRES_PASSWORD: aegis
            POSTGRES_DB: aegis
        ports:
            - "5432:5432"
        networks:
            - aegis-net
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        deploy:
            resources:
                limits:
                    cpus: '4.0'
                    memory: 2G
                reservations:
                    cpus: '1.0'
                    memory: 512M
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
            interval: 8s
            timeout: 4s
            retries: 4
            start_period: 16s

    # durable store: idempotency claims, rate-limit windows, pub/sub.
    # noeviction turns memory pressure into loud write errors (fail-open)
    # instead of silently evicting correctness-critical keys (note.md §1.4).
    redis:
        image: redis:8.0-alpine
        container_name: aegis-redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        networks:
            - aegis-net
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes --maxmemory 800mb --maxmemory-policy noeviction
        deploy:
            resources:
                limits:
                    cpus: '2.0'
                    memory: 1G
                reservations:
                    cpus: '0.5'
                    memory: 256M
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 8s
            timeout: 4s
            retries: 4
            start_period: 4s

    # evictable cache L2 only. No persistence (a cold cache just misses);
    # allkeys-lru is the correct policy here, isolated from the durable
    # instance above.
    redis-cache:
        image: redis:8.0-alpine
        container_name: aegis-redis-cache
        restart: unless-stopped
        ports:
            - "6380:6379"
        networks:
            - aegis-net
        command: redis-server --maxmemory 800mb --maxmemory-policy allkeys-lru
        deploy:
            resources:
                limits:
                    cpus: '2.0'
                    memory: 1G
                reservations:
                    cpus: '0.5'
                    memory: 256M
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 8s
            timeout: 4s
            retries: 4
            start_period: 4s

networks:
    aegis-net:

volumes:
    postgres_data:
    redis_data:
