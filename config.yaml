server:
  host: "0.0.0.0"
  port: 8000
  request_timeout_secs: 32
  shutdown_timeout_secs: 16

postgres:
  url: "postgres://aegis:aegis@localhost:5432/aegis"
  max_connections: 16
  acquire_timeout_secs: 4

redis:
  url: "redis://localhost:6379"
  # Evictable cache-L2 instance (note.md §1.4). Omit to run single-instance
  # mode with cache L2 sharing `url` (and its eviction gap).
  cache_url: "redis://localhost:6380"

cache:
  enabled: true
  moka:
    enabled: true
    max_capacity: 4096
    time_to_live_secs: 256
    time_to_idle_secs: 64
  redis:
    enabled: true
    ttl_secs: 512
    key_prefix: "aegis:records:"
  invalidation:
    enabled: true
    channel: "aegis:cache:invalidate"

slindow:
  enabled: true
  requests_per_window: 4096
  window_secs: 60
  key_prefix: "aegis:ratelimit:"
  script_path: "scripts/slindow.lua"

coalescer:
  enabled: true

deduper:
  enabled: true
  header: "idempotency-key"
  require_key: true
  bloom:
    enabled: true
    capacity: 1000000
    false_positive_rate: 0.0001
    buckets: 4
    bucket_ttl_secs: 21600
  redis:
    enabled: true
    key_prefix: "aegis:idem:"
    ttl_secs: 86400
    # In-flight lock lifetime (note.md §1.1). Must exceed
    # server.request_timeout_secs (32s) with margin, but be tiny vs ttl_secs
    # so a crashed holder stops wedging retries after ~2min, not 24h.
    inflight_ttl_secs: 120
