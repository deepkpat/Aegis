server:
  host: "0.0.0.0"
  port: 8000
  request_timeout_secs: 32
  shutdown_timeout_secs: 16

postgres:
  url: "postgres://aegis:aegis@localhost:5432/aegis"
  max_connections: 16
  acquire_timeout_secs: 4

redis:
  url: "redis://localhost:6379"

cache:
  enabled: true
  moka:
    enabled: true
    max_capacity: 4096
    time_to_live_secs: 256
    time_to_idle_secs: 64
  redis:
    enabled: true
    ttl_secs: 512
    key_prefix: "aegis:records:"

slindow:
  enabled: true
  requests_per_window: 4096
  window_secs: 60
  key_prefix: "aegis:ratelimit:"
  script_path: "scripts/slindow.lua"

coalescer:
  enabled: true

deduper:
  enabled: true
  key_prefix: "aegis:idem:"
  ttl_secs: 86400
  header: "idempotency-key"
  require_key: true
